name: build_release

on:
  push:
    branches: [latest]
    tags: ["*"]
  pull_request:
    branches: [latest]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# For softprops/action-gh-release and cloudflare/pages-action
permissions:
  contents: [write, read]
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2022-historic
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          apt-get update -y
          apt-get install --no-install-recommends -y fonts-noto-cjk-extra
          xelatex main.tex
          xelatex main.tex
          mkdir dist
          mv main.pdf dist

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          path: dist/main.pdf

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/main.pdf

      # https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/#use-github-actions
      - name: Publish
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: resume # https://resume.wu-kan.cn
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
